<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Navbar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">MyLibrary</div>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Books</a></li>
      <li><a href="#">Categories</a></li>
      <li><a href="#">Issue Book</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
     <button class="login-btn" onclick="openLogin()">Login</button>
  </nav>

  <!-- Login Popup Box -->
  <div class="login-popup" id="loginBox">
    <div class="login-box">
      <span class="close-btn" onclick="closeLogin()">×</span>
      <h2>Login</h2>
      <input type="text" placeholder="Enter Username">
      <input type="password" placeholder="Enter Password">
      <button>Login</button>
      <script src="abhi.js"></script>
</body>
</html>
